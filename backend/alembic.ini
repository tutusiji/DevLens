# DevLens Alembic 配置
# 数据库连接串从 app.config.settings（DATABASE_URL 环境变量）读取，见 alembic/env.py。

[alembic]
script_location = alembic
# 迁移文件名格式：0001_baseline.py 形式，避免依赖时间戳带来的排序歧义
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
